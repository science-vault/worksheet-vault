name: Update worksheet catalogue
on:
  push:
    branches: [main]
    paths:
      - 'uploads/**'
      - 'scripts/build_catalogue.py'
      - 'catalogue/resource-metadata.json'
      - 'catalogue/resource-names.json'
      - 'catalogue/metadata-batches/**'
      - '.github/workflows/update-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document preview tools
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils
      - name: Install image preview support
        run: python -m pip install Pillow
      - name: Generate catalogue
        run: python scripts/build_catalogue.py
      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/
          if ! git diff --cached --quiet; then
            git commit -m "Update worksheet catalogue from uploads"
            git push
          fi
